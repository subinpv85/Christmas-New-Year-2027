<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Association Event RSVP</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 450px;
        }
        h2 { margin-top: 0; color: #1f2937; }
        p { color: #4b5563; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #374151; font-size: 14px; }
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button, input[type="submit"] {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover, input[type="submit"]:hover { background-color: #1d4ed8; }
        .btn-secondary { background-color: #9ca3af; margin-top: 10px; }
        .btn-secondary:hover { background-color: #4b5563; }
        .hidden { display: none; }
        .error { color: #dc2626; font-size: 14px; margin-top: 5px; }
        .welcome-msg { background-color: #eff6ff; padding: 12px; border-radius: 6px; border-left: 4px solid #2563eb; color: #1e40af; font-weight: 600; margin-bottom: 20px; }
        .warning-box { background-color: #fef3c7; border-left: 4px solid #d97706; color: #92400e; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Event RSVP Portal</h2>
    
    <!-- STEP 1: LOOKUP STEP -->
    <div id="lookup-step">
        <p>Please enter your Unique Reference Number to verify your details and RSVP.</p>
        <div class="form-group">
            <label for="ref-input">Unique Reference Number</label>
            <input type="text" id="ref-input" placeholder="e.g., m101">
            <div id="error-msg" class="error hidden">Reference number not found. Please check and try again.</div>
        </div>
        <button type="button" id="verify-btn" onclick="verifyMember()">Verify My Details</button>
    </div>

    <!-- PROMPT STEP: IF ALREADY ENTERED RESPONSE -->
    <div id="duplicate-warning-step" class="hidden">
        <div class="warning-box">
            <strong>Notice:</strong> You have already entered a response for this event. Do you want to make changes to your previous response?
        </div>
        <button type="button" onclick="proceedToForm()">Yes, Change My Response</button>
        <button type="button" class="btn-secondary" onclick="cancelEntry()">No, Cancel</button>
    </div>

    <!-- STEP 2: DETAILS & SUBMIT STEP -->
    <form id="rsvp-form" class="hidden" action="https://script.google.com/macros/s/AKfycbz3ZWhTUT4BbxamQzoGaa4xQ7wRG1R1ReR6SWaMhCAwFxKzD6Gpb8QYbTY1vVkXKzon4Q/exec" method="POST">
        <input type="hidden" name="refNumber" id="form-ref">
        <input type="hidden" name="fullName" id="form-name">

        <div class="welcome-msg" id="welcome-text"></div>

        <div class="form-group">
            <label for="attendance">Will you be attending?</label>
            <select name="attendance" id="attendance" required>
                <option value="Yes">Yes, I will be there!</option>
                <option value="No">No, I cannot make it</option>
            </select>
        </div>

        <div class="form-group">
            <label for="guests">Number of Additional Guests</label>
            <select name="guests" id="guests">
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3+">3+</option>
            </select>
        </div>

        <div class="form-group">
            <label for="notes">Dietary Requirements / Notes</label>
            <input type="text" name="notes" id="notes" placeholder="e.g., Vegetarian, allergies, none">
        </div>

        <input type="submit" value="Confirm RSVP">
    </form>
</div>

<script>
    const memberRoster = {
        "m101": "John Smith",
        "m102": "Sarah Jones",
        "m103": "Mike Evans",
        "m104": "David Beckham"
    };

    document.getElementById('ref-input').addEventListener('input', function(e) {
        this.value = this.value.toLowerCase();
    });

    let currentInputRef = "";

    function verifyMember() {
        const input = document.getElementById('ref-input').value.trim().toLowerCase();
        const errorMsg = document.getElementById('error-msg');
        const verifyBtn = document.getElementById('verify-btn');
        
        if (memberRoster[input]) {
            errorMsg.classList.add('hidden');
            currentInputRef = input;
            verifyBtn.innerText = "Checking submission status...";
            verifyBtn.disabled = true;

            // Call Google Script via dynamic script element to avoid CORS block issues
            const scriptUrl = document.getElementById('rsvp-form').action + "?checkRef=" + encodeURIComponent(input) + "&callback=handleDuplicateCheck";
            const oldScript = document.getElementById('jsonp-checker');
            if (oldScript) oldScript.remove();

            const script = document.createElement('script');
            script.id = 'jsonp-checker';
            script.src = scriptUrl;
            document.body.appendChild(script);

        } else {
            errorMsg.classList.remove('hidden');
        }
    }

    // Process the background verification answer from Google Sheets
    function handleDuplicateCheck(response) {
        const verifyBtn = document.getElementById('verify-btn');
        verifyBtn.innerText = "Verify My Details";
        verifyBtn.disabled = false;

        const lookupStep = document.getElementById('lookup-step');
        
        document.getElementById('form-ref').value = currentInputRef;
        document.getElementById('form-name').value = memberRoster[currentInputRef];
        document.getElementById('welcome-text').innerText = `Welcome back, ${memberRoster[currentInputRef]}!`;

        if (response.responded === true) {
            // Member has already submitted an RSVP -> show warning dialogue
            lookupStep.classList.add('hidden');
            document.getElementById('duplicate-warning-step').classList.remove('hidden');
        } else {
            // Brand new registration -> send straight to data form
            lookupStep.classList.add('hidden');
            document.getElementById('rsvp-form').classList.remove('hidden');
        }
    }

    function proceedToForm() {
        document.getElementById('duplicate-warning-step').classList.add('hidden');
        document.getElementById('rsvp-form').classList.remove('hidden');
    }

    function cancelEntry() {
        // Resets portal back to the beginning screen
        document.getElementById('duplicate-warning-step').classList.add('hidden');
        document.getElementById('ref-input').value = "";
        document.getElementById('lookup-step').classList.remove('hidden');
    }
</script>

</body>
</html>
