<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Association Event RSVP</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 450px;
        }
        h2 { margin-top: 0; color: #1f2937; }
        p { color: #4b5563; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #374151; font-size: 14px; }
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #1d4ed8; }
        .hidden { display: none; }
        .error { color: #dc2626; font-size: 14px; margin-top: 5px; }
        .welcome-msg { background-color: #eff6ff; padding: 12px; border-radius: 6px; border-left: 4px solid #2563eb; color: #1e40af; font-weight: 600; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Event RSVP Portal</h2>
    <p>Please enter your Unique Reference Number to verify your details and RSVP.</p>

    <!-- STEP 1: LOOKUP STEP -->
    <div id="lookup-step">
        <div class="form-group">
            <label for="ref-input">Unique Reference Number</label>
            <input type="text" id="ref-input" placeholder="e.g., REF101">
            <div id="error-msg" class="error hidden">Reference number not found. Please check and try again.</div>
        </div>
        <button type="button" onclick="verifyMember()">Verify My Details</button>
    </div>

    <!-- STEP 2: DETAILS & SUBMIT STEP (SUBMITS TO GOOGLE WEB APP) -->
    <form id="rsvp-form" class="hidden" method="POST">
        <!-- Hidden inputs to send matched details to Google Sheet -->
        <input type="hidden" name="refNumber" id="form-ref">
        <input type="hidden" name="fullName" id="form-name">

        <div class="welcome-msg" id="welcome-text"></div>

        <div class="form-group">
            <label for="attendance">Will you be attending?</label>
            <select name="attendance" id="attendance" required>
                <option value="Yes">Yes, I will be there!</option>
                <option value="No">No, I cannot make it</option>
            </select>
        </div>

        <div class="form-group">
            <label for="guests">Number of Additional Guests</label>
            <select name="guests" id="guests">
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3+">3+</option>
            </select>
        </div>

        <div class="form-group">
            <label for="notes">Dietary Requirements / Notes</label>
            <input type="text" name="notes" id="notes" placeholder="e.g., Vegetarian, allergies, none">
        </div>

        <button type="submit" id="submit-btn">Confirm RSVP</button>
    </form>
    
    <!-- STEP 3: SUCCESS MESSAGE -->
    <div id="success-step" class="hidden">
        <div class="welcome-msg" style="border-left-color: #10b981; color: #065f46; background-color: #ecfdf5;">
            🎉 RSVP Submitted Successfully! Thank you.
        </div>
        <p>Your details have been logged directly into the master registry database.</p>
    </div>
</div>

<script>
    // YOUR MEMBERSHIP ROSTER DATA (Update this with your real list)
    const memberRoster = {
        "REF101": "John Smith",
        "REF102": "Sarah Jones",
        "REF103": "Mike Evans",
        "REF104": "David Beckham"
    };

    function verifyMember() {
        const input = document.getElementById('ref-input').value.trim().toUpperCase();
        const errorMsg = document.getElementById('error-msg');
        const lookupStep = document.getElementById('lookup-step');
        const rsvpForm = document.getElementById('rsvp-form');
        const welcomeText = document.getElementById('welcome-text');

        if (memberRoster[input]) {
            errorMsg.classList.add('hidden');
            
            // Populating the form data
            document.getElementById('form-ref').value = input;
            document.getElementById('form-name').value = memberRoster[input];
            welcomeText.innerText = `Welcome, ${memberRoster[input]}!`;
            
            // Toggle view panels
            lookupStep.classList.add('hidden');
            rsvpForm.classList.remove('hidden');
        } else {
            errorMsg.classList.remove('hidden');
        }
    }

    // INTERCEPT SUBMISSION TO ROUTE TO GOOGLE APPS SCRIPT WEB APP
    document.getElementById('rsvp-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('submit-btn');
        submitBtn.innerText = "Submitting...";
        submitBtn.disabled = true;

        // PASTE YOUR GOOGLE WEB APP URL HERE BEFORE UPLOADING TO GITHUB
        const googleWebAppUrl = "PASTE_YOUR_GOOGLE_WEB_APP_URL_HERE";

        const formData = new FormData(this);
        
        fetch(googleWebAppUrl, {
            method: 'POST',
            body: formData,
            mode: 'no-cors' // Bypasses browser restriction rules securely
        })
        .then(() => {
            document.getElementById('rsvp-form').classList.add('hidden');
            document.getElementById('success-step').classList.remove('hidden');
        })
        .catch(err => {
            alert("Error sending details. Please check your internet connection.");
            submitBtn.innerText = "Confirm RSVP";
            submitBtn.disabled = false;
        });
    });
</script>

</body>
</html>
